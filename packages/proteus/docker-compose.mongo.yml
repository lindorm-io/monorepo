services:
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok && quit(0) } catch(e) {
            rs.initiate({_id:'rs0', members:[{_id:0, host:'localhost:27017'}]});
            quit(1);
          }
        "
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 10s
