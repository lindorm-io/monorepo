# Aggregate compose — brings up every service from a single source of truth.
# Service definitions live once in the per-driver files below; the full-run
# scripts (`test`, `test:integration`) use this aggregate, while each
# `test:tck:<driver>` script uses only its matching per-driver file.
include:
  - docker-compose.postgres.yml
  - docker-compose.mysql.yml
  - docker-compose.mongo.yml
  - docker-compose.redis.yml
