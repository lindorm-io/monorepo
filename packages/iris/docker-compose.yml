# Aggregate of the per-driver compose files — brings every broker up at once
# for `npm test` / `test:update`. Each service is defined once in its own
# docker-compose.<driver>.yml; the per-driver TCK scripts use those directly.
include:
  - docker-compose.kafka.yml
  - docker-compose.nats.yml
  - docker-compose.rabbit.yml
  - docker-compose.redis.yml
