services:
  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
    healthcheck:
      # Gate on JetStream being ready, not just the server — so `composed` waits
      # for a warm broker before starting the TCK (a cold JS server makes the
      # per-suite consumer/stream setup hooks time out).
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8222/healthz?js-enabled-only=true' || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
