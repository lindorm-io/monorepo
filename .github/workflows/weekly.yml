name: weekly

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Kafka stays weekly — too slow/janky for the PR matrix. It runs as a normal
# `test:tck:kafka` (part of the TCK banner conceptually), just on a schedule.
# `composed` brings up the broker from docker-compose.kafka.yml.

jobs:
  tck-kafka:
    name: TCK — iris / kafka
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 25.x
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test (tck — kafka)
        run: npm --prefix packages/iris run test:tck:kafka
