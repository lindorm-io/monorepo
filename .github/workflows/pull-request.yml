name: pull-request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

# All stages run in PARALLEL — no `needs:` chaining. Quicker turnaround and you
# see every failure at once (the true fail-fast). Docker is brought up by
# `composed` from the same per-driver compose files used locally (single source
# of truth; no GitHub `services:` blocks to keep in sync). Kafka is not here — it
# stays weekly (see weekly.yml).

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 25.x
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 25.x
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck

  test-unit:
    name: Test (unit) — ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Shard the unit suite across runners. The docker-FREE TCKs (sqlite/memory)
    # ride here too — they need no service, so there's no reason to spend a
    # docker runner on them. They stay `test:tck:*` scripts (the TCK banner),
    # they just execute in the unit bucket.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: proteus
            args: --scope @lindorm/proteus
          - name: iris-pylon
            args: --scope @lindorm/iris --scope @lindorm/pylon
          - name: rest
            args: --ignore @lindorm/proteus --ignore @lindorm/iris --ignore @lindorm/pylon

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 25.x
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test (unit)
        run: npx lerna run test:unit ${{ matrix.args }}
      - name: Test (tck — sqlite, no docker)
        if: matrix.name == 'proteus'
        run: npx lerna run test:tck:sqlite ${{ matrix.args }}
      - name: Test (tck — memory, no docker)
        if: matrix.name == 'proteus' || matrix.name == 'iris-pylon'
        run: npx lerna run test:tck:memory ${{ matrix.args }}

  test-integration:
    name: Test (integration) — ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [proteus, iris]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 25.x
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test (integration)
        run: npm --prefix packages/${{ matrix.package }} run test:integration

  tck:
    name: TCK — ${{ matrix.package }} / ${{ matrix.driver }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # One job = one package × one driver = one composed-managed service, on its
    # own runner (no port conflicts). This matrix IS the grouped "TCK" banner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: proteus, driver: postgres }
          - { package: proteus, driver: mysql }
          - { package: proteus, driver: mongo }
          - { package: proteus, driver: redis }
          - { package: iris, driver: nats }
          - { package: iris, driver: redis }
          - { package: iris, driver: rabbit }

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 25.x
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test (tck)
        run: npm --prefix packages/${{ matrix.package }} run test:tck:${{ matrix.driver }}
